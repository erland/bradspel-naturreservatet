name: "02 Build Print Preview"

on:
  workflow_dispatch:

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-recommended texlive-fonts-recommended fonts-dejavu
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Build printable PDFs
        run: python scripts/build_print.py
      - name: Upload print preview
        uses: actions/upload-artifact@v4
        with:
          name: naturreservatet-print-preview
          path: |
            output/print/*.pdf
            output/print/PRINT_MANIFEST.json
