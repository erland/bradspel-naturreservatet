name: Validate

on:
  pull_request:
    paths:
      - "assets/**"
      - "data/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - "README.md"
      - "PROJECT_STATUS.md"
      - "CHANGELOG.md"
      - "requirements.txt"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "data/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - "README.md"
      - "PROJECT_STATUS.md"
      - "CHANGELOG.md"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate project
        run: python scripts/validate_project.py .

      - name: Run simulator tests
        run: python -m unittest discover -s tests -v
